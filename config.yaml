# ============================================================
# Dataset
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /home/rvi-lab/workspace/sound-spaces/dataset_simplified
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true

# ============================================================
# Model
# ============================================================
model:
  name: unet_baseline
  generator: unet_256  # unet_256 or unet_128

# ============================================================
# Training
# ============================================================
train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.001
  optimizer: AdamW  # AdamW, Adam, SGD
  criterion: L1  # L1, SIlog, Combined
  l1_weight: 1.0
  silog_weight: 0.5
  silog_lambda: 0.5
  validation: true
  validation_iter: 5
  num_threads: 16
  batch_size: 32
  shuffle: true

# ============================================================
# Test
# ============================================================
test:
  eval_on: test  # test or val
  checkpoints: best  # epoch number or 'best'
  num_threads: 4
  batch_size: 1
