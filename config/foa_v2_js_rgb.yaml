# ============================================================
# FOAv2-JS-RGB: teacher-guided training with ERP RGB images.
# At train time, Swin encoder processes RGB; at test time, only audio is used.
# Losses: (1) depth (BerHu+SILog), (2) FOA L1, (3) feature alignment L2.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  use_rgb: true

model:
  name: foa_v2_js_rgb
  generator: unet_256
  proj_dim: 128
  foa_dim: 4
  sh_order: 5
  scale_shift_hidden: 256
  scale_shift_layers: 4
  depth_weight: 1.0
  foa_weight: 0.1
  align_weight: 0.1

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 4
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
