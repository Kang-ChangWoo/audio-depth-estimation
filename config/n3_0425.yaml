# ============================================================
# n3_0425 — Binaural-only FOA representation prediction (no depth).
#
# See docs/experiment_plan_predict_FOA.md and
# models/n3_0425/n3_0425.py.
#
# This base config defaults to Eigen-8 (matches n9_0424 supervision).
# The bulk script overrides `--rep-kind` and `--rep-K` to cover the full
# 6-cell experimental matrix: {RMS, Eigen} × {1, 8, 100}.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # 5-tuple batch (audio, depth, foa_target, energy_map, rep_gt) where
  # rep_gt has shape (rep_K, 4) computed via rep_kind from the IR.
  use_distance_bins: true
  rep_kind: eigen           # 'eigen' or 'rms'  — overridden by --rep-kind
  rep_K: 8                  # 1, 8, or 100      — overridden by --rep-K
  gt_energy_window: early_mid

model:
  name: n3_0425
  generator: n3_0425
  # Built via _PVITFOA_CLASSES branch. n3_0425 ignores ViT-specific kwargs
  # (pretrained, freeze_encoder) via **_unused.
  pretrained: false
  freeze_encoder: false
  K: 8                      # must match dataset.rep_K (mirrored by --rep-K)
  ngf: 64
  lambda_dir: 0.1           # cosine direction loss weight (eigen only)

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 20
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 128
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 4
