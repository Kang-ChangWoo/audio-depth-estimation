# ============================================================
# n9_0425 — Binaural UNet + bin-gated FOA conditioning from a
# PRE-TRAINED n3_0425 (binaural → FOA) cascade.
#
# Mirrors config/n4_0425.yaml. Key differences:
#   - cfg.model.n3_checkpoint    path to trained n3_0425 best_model.pth
#   - cfg.model.freeze_n3        True = n3 frozen + eval(); False = finetune
#
# The training step (_train_step_foa_0415) ignores any rep_gt because
# n9_0425's forward() doesn't accept it — n3 produces rep_pred directly
# from the binaural input. lambda_sh > 0 still works: the train step
# applies weighted_rep_loss(rep_pred, rep_gt), which becomes a fine-tune
# signal for n3 (active only when freeze_n3=False; when frozen, the
# loss is still computed but no gradient reaches n3 weights).
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # 5-tuple (rep_gt) is required so the train step can compute the
  # optional weighted_rep_loss(rep_pred, rep_gt) for n3 fine-tuning,
  # and so test_utils can compute FOA error metrics.
  use_distance_bins: true
  rep_kind: eigen
  rep_K: 8
  gt_energy_window: early_mid

model:
  name: n9_0425
  generator: n9_0425
  pretrained: false
  freeze_encoder: false
  K: 8
  ngf: 64
  n3_ngf: 64
  gate_init: 2.0
  # Path to the pre-trained n3_0425 best_model.pth. Override per-experiment
  # via --n3-checkpoint on the CLI (see scripts/n9_bulk.sh).
  n3_checkpoint: null
  # True = freeze n3 (frozen + eval()); False = co-train n3 with the
  # outer UNet. Override via --freeze-n3 / --no-freeze-n3.
  freeze_n3: true
  # Loss weights. lambda_sh > 0 trains n3 toward rep_gt (only meaningful
  # when freeze_n3=False). lambda_sparsity controls bin-gate sparsity.
  depth_weight: 1.0
  lambda_sh: 0.0
  lambda_sparsity: 0.1
  lambda_energy: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 64
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 4
