# ============================================================
# pvitfoa_v3_distill (exp230) — ViT student distilled from UNet oracle.
#   Reuses PretrainedViTFOAV3 as the student. Teacher (UNet
#   foa_oracle_nc3, e.g. exp180) is loaded via --teacher-ckpt; the
#   _train_step_foa_0415 path adds
#     L += lambda_kd * (L1(pred_depth_s, pred_depth_t)
#                     + L1(pred_sh_s,    pred_sh_t))
#   when lambda_kd > 0 and a teacher is provided. Cross-architecture
#   distillation works at the output level — shapes match (both emit
#   pred_depth (B,1,H,W) and pred_sh (B,sh_dim)).
# Pass --lambda-kd 0.5 via the bulk script (default here is 0).
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true

model:
  name: pretrained_vit_foa_v3
  generator: pretrained_vit_foa_v3
  pretrained: true
  freeze_encoder: false
  sh_dim: 4
  head_hidden: 256
  n_early: 4
  depth_weight: 1.0
  lambda_sh: 0.1
  lambda_kd: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 16
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
