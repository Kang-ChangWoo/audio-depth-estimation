# ============================================================
# n9_0424 — Variant A: Baseline
#   Purpose: depth-only reference for the n9 family. The fusion block is
#   disabled (F_out == F_in) AND rep prediction is not supervised
#   (--lambda-sh 0.0 on the CLI). This gives the pure "spec-ViT → DPT"
#   baseline so Variants B–E can be compared against it with everything
#   else held fixed.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # rep_gt is still computed (cheap per-sample eigendecomposition), but
  # lambda_sh=0 on the CLI means it doesn't enter the loss. Kept ON so
  # batch shape matches Variants B–E for a clean dataloader cache.
  use_distance_bins: true
  gt_energy_window: early_mid

model:
  name: n9_0424
  generator: n9_0424
  pretrained: true
  freeze_encoder: false
  taps: [4, 8, 12]
  fusion_ch: 256
  attn_heads: 4
  # Fusion knobs — A is the baseline so fusion is off and the rep-head
  # sits idle (still emits rep_pred but it's not supervised).
  K: 8
  D: 128
  res_scale_init: 0.1
  gate_learnable: true
  enable_fusion: false
  # Off for the entire A–E sweep so ablation factors stay clean.
  # Turn on in a follow-up run to isolate the effect of refinement.
  enable_refinement: false
  depth_weight: 1.0
  # lambda_sh=0 on the CLI kills the rep loss entirely for Variant A.
  lambda_sh: 0.0
  lambda_energy_map: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 8
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
