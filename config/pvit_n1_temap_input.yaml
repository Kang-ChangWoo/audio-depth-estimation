# ============================================================
# pvit_n1_temap_input (exp241-243) — ViT with 5ch concat input
#   (binaural[2] + early/mid/late energy maps[3]).
#   Route: _train_step_n2 (temap_input branch, extended to include
#   pvit_n1_temap_input). Dataset: dataset_n2 (7-tuple). Simplest
#   ViT x temporal hybrid — the model can ignore the 3 extra channels
#   if they don't help.
# Model class: PVitN1TemapInput (models/n1_4020/pvit_temap.py)
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  use_n2_features: true

model:
  name: pvit_n1_temap_input
  generator: pvit_n1_temap_input
  pretrained: true
  freeze_encoder: false
  input_nc: 5
  sh_dim: 12
  head_hidden: 256
  depth_weight: 1.0
  lambda_sh: 0.1

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 16
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
