# n3_energy_attn_distill — oracle distillation student (report_d exp215)
# Student: n3_energy_attn (deployable). Teacher: foa_oracle_nc3 (exp180).
# Pass teacher via CLI: --teacher-ckpt <path> --lambda-kd 0.5
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
model:
  name: n3_energy_attn
  generator: unet_256
  sh_dim: 4
  head_hidden: 256
  depth_weight: 1.0
  lambda_sh: 0.1
  lambda_energy: 0.0
  lambda_kd: 0.5
  # teacher_ckpt: set via --teacher-ckpt; looks like
  #   checkpoints/unet_256_soundspaces_BS128_Lr0.001_AdamW_exp180_oracle_nc3_lr1e3_lsh0.3/best_model.pth
train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 60
  learning_rate: 0.001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 32
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 1.0
test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
