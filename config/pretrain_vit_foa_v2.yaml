# ============================================================
# pretrain_vit_foa_v2 — ViT + histogram alignment (energy-map)
#   Full SH branch (order 5 -> 36 dims) + DeepScaleShift +
#   dense histogram alignment against the covariance-derived
#   ambisonic energy map (foa_v2_js-style supervision).
#   Routes through _train_step_js + AudioDepthFOALoss.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true

model:
  name: pretrained_vit_foa_v2
  generator: pretrained_vit_foa_v2
  pretrained: true
  freeze_encoder: false
  sh_order: 5
  foa_dim: 4
  proj_dim: 128
  scale_shift_hidden: 256
  scale_shift_layers: 4
  depth_weight: 1.0
  foa_weight: 0.1
  hist_weight: 0.1
  foa_freeze_epochs: 0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 16
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
