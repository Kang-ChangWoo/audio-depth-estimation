# ============================================================
# n9_0426 — n9_0425 cascade with a pretrained-ViT/ResNet outer hourglass.
#
# Architecture identical to n9_0425 except the outer 8-level UNet is
# replaced by a torchvision ViT-B/16 or ResNet-50 (ImageNet pretrained).
# Outer input is concat(binaural, gated_em) — 3 channels.
#
# See models/n9_0426/n9_0426.py for full pipeline diagram.
#
# Outer-backbone knobs (override per-experiment from CLI):
#   cfg.model.backbone        'vit' or 'resnet'
#   cfg.model.freeze_backbone True/False
# Inner-n3 knobs (same semantics as n9_0425):
#   cfg.model.n3_checkpoint   path to a trained n3_0425 best_model.pth
#   cfg.model.freeze_n3       True/False
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # 5-tuple (rep_gt) is required so the train step can compute the
  # optional weighted_rep_loss(rep_pred, rep_gt) for n3 fine-tuning,
  # and so test_utils can compute FOA error metrics.
  use_distance_bins: true
  rep_kind: eigen
  rep_K: 8
  gt_energy_window: early_mid

model:
  name: n9_0426
  generator: n9_0426
  pretrained: true               # ImageNet weights for the outer backbone.
  freeze_encoder: false          # legacy; ignored by n9_0426 (use freeze_backbone).
  K: 8
  n3_ngf: 64
  gate_init: 2.0
  # Outer pretrained hourglass.
  backbone: vit                  # 'vit' or 'resnet' — overridden per-exp.
  freeze_backbone: false         # freeze pretrained encoder weights.
  # Inner n3_0425 (same as n9_0425).
  n3_checkpoint: null            # set per-exp via --n3-checkpoint.
  freeze_n3: true                # frozen by default; --no-freeze-n3 to finetune.
  # Loss weights. lambda_sh > 0 trains n3 toward rep_gt (only meaningful
  # when freeze_n3=False). lambda_sparsity controls bin-gate sparsity.
  depth_weight: 1.0
  lambda_sh: 0.0
  lambda_sparsity: 0.1
  lambda_energy: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 64
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 4
