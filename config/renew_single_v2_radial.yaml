# ============================================================
# renew_single_v2 — Tier 1 (YAML) + Tier 2a (LR cosine+warmup) +
# Tier 2b (renew ViT freeze curriculum). Launched as exp302.
#
# Diff vs renew_single.yaml:
#   Tier 1:
#     lambda_sh        0.1  -> 0.3            (best FOA_L1 family)
#     lambda_kl_energy 0.1  -> 0.05           (KL is unbounded; halve)
#     batch_size       16   -> 32             (headroom on 4×A5000)
#     validation_iter  4    -> 2              (catch peak earlier)
#   Tier 2a (requires train.py edits, now landed):
#     lr_schedule      cosine                 (new)
#     lr_warmup_epochs 1                      (new; linear 0→lr over 1 ep)
#   Tier 2b (requires train.py edits, now landed):
#     renew_freeze_epochs 3                   (new; both ViTs frozen 3 ep)
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # Cut the IR at the early+mid boundary; drop the diffuse late tail.
  gt_energy_window: early_mid

model:
  name: renew_single
  generator: renew_single
  pretrained: true
  freeze_encoder: false
  sh_dim: 36
  head_hidden: 512
  taps: [4, 8, 12]
  sf_mode: rank1
  teacher_ratio: 0.0
  fusion_ch: 256
  attn_heads: 4
  depth_weight: 1.0
  # Tier 1 change: stronger SH anchor (exp243 won at 0.3)
  lambda_sh: 0.3
  lambda_energy: 0.1
  # Tier 1 change: halve KL so it doesn't dominate (raw KL ~ 3-4 at init)
  lambda_kl_energy: 0.05
  # Tier 2b: freeze both ViT backbones for the first 3 epochs
  # (heads/neck/decoder learn against frozen pretrained features first).
  renew_freeze_epochs: 3

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  # Tier 1: check val every 2 epochs for earlier best-model selection
  validation_iter: 2
  num_threads: 4
  # Tier 1: BS 16 -> 32 (8 per GPU on 4×A5000-24GB; ~7GB/GPU peak)
  batch_size: 32
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5
  # Tier 2a: linear warmup over 1 epoch, then cosine decay to 0 over the
  # remaining 39 epochs.
  lr_warmup_epochs: 1
  lr_schedule: cosine

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
