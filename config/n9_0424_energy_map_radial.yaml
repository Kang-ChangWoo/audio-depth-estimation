# ============================================================
# n9_0424 — Variant D: Projection Fusion + Energy Map Loss
#   Purpose: add the projection-consistency loss (log1p(signed²) maps
#   built from rep_pred and rep_gt, weighted SmoothL1) on top of Variant
#   C. Tests whether supervising the *shape* of the projected sound-
#   field map helps depth beyond supervising the 4-vector coefficients
#   alone. Expected effect: small, depends on whether basis-projection
#   mismatch was the bottleneck (often not — try only after C is stable).
#
#   lambda_energy_map=0.25 is the Stage-3 recommendation from the spec.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  use_distance_bins: true
  gt_energy_window: early_mid

model:
  name: n9_0424
  generator: n9_0424
  pretrained: true
  freeze_encoder: false
  taps: [4, 8, 12]
  fusion_ch: 256
  attn_heads: 4
  K: 8
  D: 128
  res_scale_init: 0.1
  gate_learnable: true
  enable_fusion: true
  enable_refinement: false
  depth_weight: 1.0
  lambda_sh: 0.05
  lambda_energy_map: 0.25   # ← Variant D: projection consistency ON
  # Note: lambda_energy_map uses the fusion block's feature-grid basis
  # (16×32 at images_size=[256,512] / patch=16), not the full ERP grid.
  # The loss is on the *shape* of log1p(signed²) maps, not their absolute
  # magnitude — sign canonicalization in rep_gt matters for stability.

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 8
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
