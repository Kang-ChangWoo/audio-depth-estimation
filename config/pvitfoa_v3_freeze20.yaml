# ============================================================
# pvitfoa_v3_freeze20 (exp220) — v3 FiLM ViT with frozen encoder.
#   NOTE: the "20" in the exp name refers to the gradual-unfreeze idea
#   from the UNet freeze_epochs knob, which is not wired for the ViT
#   backbone (foa_freeze_epochs only applies when is_foa_model(cfg) is
#   True — see train.py line 551). Here we use a permanent encoder
#   freeze (freeze_encoder=true) as the ViT-side analogue; this keeps
#   the pretrained representations intact and lets only the SH head,
#   FiLM projector, and depth decoder update during training.
#   Reuses PretrainedViTFOAV3.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true

model:
  name: pretrained_vit_foa_v3
  generator: pretrained_vit_foa_v3
  pretrained: true
  freeze_encoder: true
  sh_dim: 4
  head_hidden: 256
  n_early: 4
  depth_weight: 1.0
  lambda_sh: 0.1

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 16
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
