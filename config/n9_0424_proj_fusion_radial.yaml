# ============================================================
# n9_0424 — Variant C: Projection Fusion (main architecture)
#   Purpose: turn on the full ImplicitSoundFieldProjectionFusion —
#   rep_pred → ERP basis projection → map adapter + FiLM → gated residual
#   update. If depth improves more here than in Variant B, the learned
#   adapter is doing real work (converting coefficients into depth-useful
#   feature maps), which is the whole point of the design.
#
#   res_scale_init=0.1 keeps F_out ≈ F_in at init; res_scale is learnable
#   so the model can decide how much to lean on the sound-field path.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  use_distance_bins: true
  gt_energy_window: early_mid

model:
  name: n9_0424
  generator: n9_0424
  pretrained: true
  freeze_encoder: false
  taps: [4, 8, 12]
  fusion_ch: 256
  attn_heads: 4
  K: 8
  D: 128
  res_scale_init: 0.1
  gate_learnable: true
  enable_fusion: true      # ← Variant C: full fusion ON
  enable_refinement: false
  depth_weight: 1.0
  lambda_sh: 0.05
  lambda_energy_map: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 8
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
