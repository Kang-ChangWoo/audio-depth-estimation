# ============================================================
# n9_0424 — Variant B: Aux-only (rep pred, no fusion)
#   Purpose: check whether the Method-E target rep_gt is learnable from
#   the spec-ViT features alone. Fusion is DISABLED (F_out == F_in) so
#   the only new signal is lambda_sh · weighted_rep_loss(rep_pred, rep_gt).
#   If rep loss drops but depth does not change much, we've confirmed
#   (1) target scale is right, (2) sign canonicalization is working, and
#   (3) the coordinate frame is consistent — Variant C can be attempted
#   with confidence.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  use_distance_bins: true
  gt_energy_window: early_mid

model:
  name: n9_0424
  generator: n9_0424
  pretrained: true
  freeze_encoder: false
  taps: [4, 8, 12]
  fusion_ch: 256
  attn_heads: 4
  K: 8
  D: 128
  res_scale_init: 0.1
  gate_learnable: true
  enable_fusion: false     # ← Variant B: aux head ON, fusion OFF
  enable_refinement: false
  depth_weight: 1.0
  lambda_sh: 0.05          # default; overridden per-experiment via --lambda-sh
  lambda_energy_map: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 8
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
