# ============================================================
# renew_single — dual-ViT with explicit sound-field bottleneck.
#
# Pipeline:
#   spectrogram -> Spec ViT (taps F4/F8/F12)
#              -> FOAHead -> k_n (sh_dim=36, order-5 SH)
#              -> SoundFieldGenerator (rank-1 outer product) -> Ŝ
#              -> [optional] teacher-forcing mix: αS_gt + (1-α)Ŝ
#              -> Sound-field ViT (taps F4/F8/F12)
#              -> per-scale additive-residual fusion (Fusion1)
#              -> refinement cross-attention at F12 (Fusion2)
#              -> DPT neck + depth decoder -> pred_depth
#
# Supervision (via _train_step_foa_0415):
#   L_depth = BerHu + SILog
#   L_sh    = L1(pred_sh[:, :4], gt_foa)                 # gt_foa is 4-dim
#   L_energy= L1(pred_energy, gt_energy_map)             # lambda_energy>0
#
# Routing:
#   registered in _PVITFOA_AUX_SH_NAMES and _PVITFOA_CLASSES so the
#   foa_0415 train path handles this model directly.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  # Cut the IR at the early+mid boundary before computing the covariance
  # and SH-projection. Drops the diffuse late tail (>=295 ms). See
  # comment block at the bottom of this file for the empirical
  # justification from exp190/192/199/243.
  gt_energy_window: early_mid

model:
  name: renew_single
  generator: renew_single
  pretrained: true
  freeze_encoder: false
  # Order-5 SH head (first 4 dims supervised against gt_foa; dims 4-35
  # are free and get shaped by the depth-loss gradient via the
  # SoundFieldGenerator -> sf-ViT -> fusion -> decoder chain).
  sh_dim: 36
  head_hidden: 512
  taps: [4, 8, 12]
  sf_mode: rank1
  # teacher_ratio is the default; override per-epoch at launch time if
  # you want a curriculum. 0.0 → always use predicted Ŝ (fully
  # end-to-end, depth grad flows through sound-field generator).
  teacher_ratio: 0.0
  fusion_ch: 256
  attn_heads: 4
  depth_weight: 1.0
  lambda_sh: 0.1
  # lambda_energy > 0 supervises the generated sound field against the
  # GT energy map (physical anchor that keeps Ŝ from collapsing into a
  # depth-friendly latent shortcut — see the design notes).
  lambda_energy: 0.1
  # lambda_kl_energy > 0 adds a histogram-KL loss between pred_energy
  # and GT energy map. Maps are sum-normalized (not peak-normalized),
  # so the KL compares SHAPE only regardless of per-frame amplitude —
  # handles the "each frame has different size" concern naturally.
  lambda_kl_energy: 0.1

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 8
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1

# ============================================================
# Why gt_energy_window = early_mid (and NOT full / late)
# ============================================================
# Checked against the finished-experiment leaderboard:
#
#  1. exp190 (n2_temporal_rms, 12-dim per-bin RMS) outperformed exp192
#     (n2_temporal_energy, per-bin spatial energy maps supervised all
#     three bins). The report §11 traced this to the late bin being
#     nearly uniform across scenes: supervising it equally with early
#     and mid dilutes the informative gradient.
#          exp190 ABS=0.4370  RMSE=1.1231   ← better ABS than exp192
#          exp192 ABS=0.4734  RMSE=1.0805
#  2. The EDA diagnostic (EDA/_6_intermediate_Ambisonics/
#     DIAGNOSTIC_REPORT.md §2) showed per-bin unit-normalized pred_sh
#     for exp243 has σ ≤ 0.05 on early+mid but essentially no
#     per-frame variation on late. Late energy is diffuse ≈ room
#     constant; supervising against it just pulls the model toward a
#     fixed, shape-less target.
#  3. exp243 (ViT + 3-bin temap input, 12-dim pred_sh) has the best
#     FOA_L1 across ALL experiments = 0.0136. Its INPUT uses all three
#     bins, but the most-varying information lives in bins 0 and 1.
#
# Dataset cut at sample 13000 (~295 ms @ 44.1 kHz) matches
# dataset_n2.BINS_3[1].end — the natural "mid reverb ends" boundary.
# ============================================================
