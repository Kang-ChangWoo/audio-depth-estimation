# ============================================================
# echodiffusion_ambi_sh — EchoDiffusion + audio→SH-coefficient prediction
# + real-SH coarse layout fusion at the depth-decoder output.
#
# Pipeline summary (see models/echodiffusion/echodiffusion_ambi_sh.py):
#   spec → ASPP+ASFF + DiffusionUNet → decoder feature
#   rep_gt (B, K, 4) → MLP → SH coeffs (B, (L+1)^2)
#   coeffs → real SH basis @ basis_buffer → coarse layout (B, 1, H, W)
#   gated residual fusion(decoder feat, layout) → depth head → pred_depth
#   coeffs also feed cross-attention as a 1-token global context.
#
# CIDE / Wav2Vec2 is NOT used here. Only spec + bin-FOA conditioning.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # 5-tuple (audio, depth, foa, em, rep_gt) — same as n4_0425.
  use_distance_bins: true
  rep_kind: eigen
  rep_K: 8
  gt_energy_window: early_mid
  # CIDE/Wav2Vec2 needs the binaural waveform as a 6-tuple appendix.
  use_waveform: true
  waveform_len: 5648

model:
  name: echodiffusion_ambi_sh
  generator: echodiffusion_ambi_sh
  max_depth: 10.0
  embed_dim: 192            # decoder feature width (matches EchoDiffusion)
  emb_dim: 768              # cross-attention context_dim
  K: 8                      # distance bins; must match dataset.rep_K
  sh_order: 5               # SH order L → (L+1)^2 = 36 coefficients
  sh_hidden: 256            # AudioToSHCoeff MLP hidden width
  # === Max-capacity variant (refer earlier conversation: "option C") ===
  unet_channels: 64         # DiffusionUNet model_channels (was 32 in EchoDiff)
  decoder_channels: [256, 128, 64]   # tapered (was [32, 32, 32] in EchoDiff)
  use_cide: true            # Wav2Vec2/CIDE token PREPENDED to cross-attn ctx
  # Loss weights — routed through _train_step_foa_0415.
  depth_weight: 1.0
  lambda_sh: 0.0            # rep_pred=rep_gt, so the legacy rep loss is 0
  lambda_sparsity: 0.0      # no gate, sparsity loss not applicable
  lambda_energy: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0005
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 32
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 4
