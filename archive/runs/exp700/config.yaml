# ============================================================
# echodiffusion_ambi — EchoDiffusion backbone with bin-gated FOA
# conditioning replacing CIDE/Wav2Vec2.
#
# See models/echodiffusion/echodiffusion_ambi.py for full pipeline.
#
# Modes (override per-experiment via --foa-mode):
#   'input'      — gated_em (1ch) concat with binaural spec → 3ch ASPP+ASFF
#                  input. Cross-attention context = learnable null token.
#   'condition'  — binaural spec stays 2ch. Bin-gated rep_gt (B, K, 4) →
#                  K cross-attention tokens (B, K, 768) for the diffusion-UNet.
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # 5-tuple batch (audio, depth, foa, energy_map, rep_gt) is required.
  use_distance_bins: true
  rep_kind: eigen
  rep_K: 8
  gt_energy_window: early_mid
  # Disable waveform/CIDE — we drop that branch in favor of FOA conditioning.
  use_waveform: false

model:
  name: echodiffusion_ambi
  generator: echodiffusion_ambi
  max_depth: 10.0
  embed_dim: 192          # decoder width (matches EchoDiffusion default)
  emb_dim: 768            # cross-attention context_dim
  K: 8                    # distance-bin count; must match dataset.rep_K
  foa_mode: condition     # 'input' or 'condition'; override per-exp
  gate_init: 2.0          # sigmoid(2.0) ≈ 0.88
  # Loss weights — same routing as n4_0425 via _train_step_foa_0415.
  depth_weight: 1.0
  lambda_sh: 0.0          # rep_pred = rep_gt is identity → no FOA aux loss
  lambda_sparsity: 0.05   # weight on sigmoid(gate).mean()
  lambda_energy: 0.0

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0005
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 32
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 4
