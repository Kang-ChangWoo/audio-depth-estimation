# ============================================================
# echodiff_sh_side_plus — EchoDiffusion + SH side-prior (Plus variant).
#
# See models/n2_0427/echodiff_sh_side_plus.py.
#
# Plus = wider DiffusionUNet (model_channels=64), tapered decoder
# [256,128,64], split direction/magnitude SH head, SH context token in
# cross-attention, additive multi-scale side fusion + zero-init post-fusion.
#
# Baseline cell:           cfg.model.side_fusion=False
# Real-oracle UB cell:     cfg.model.side_fusion=True
#                          cfg.model.oracle_mode=True
#                          cfg.model.oracle_gate_mode='ones'
# ============================================================
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  depth_dir: erp_depth_radial
  # 5-tuple batch (audio, depth, foa, em, rep_gt) — same as n4_0425.
  use_distance_bins: true
  rep_kind: eigen
  rep_K: 8
  gt_energy_window: early_mid
  use_waveform: false

model:
  name: echodiff_sh_side_plus
  generator: echodiff_sh_side_plus
  max_depth: 10.0
  embed_dim: 192            # decoder feature width (matches EchoDiffusion)
  K: 8                      # distance bins; must match dataset.rep_K
  rep_hidden: 512           # SH head hidden width
  unet_channels: 64         # DiffusionUNet model_channels (Plus default)
  decoder_channels: [256, 128, 64]   # tapered decoder
  # === SH side-prior knobs (overridden per cell via CLI) ===
  side_fusion: true         # baseline cell sets this False via --no-side-fusion
  oracle_mode: false        # oracle UB cell sets this True via --oracle-mode
  oracle_gate_mode: ones    # only relevant when oracle_mode=True
  # Loss weights — routed through _train_step_foa_0415.
  depth_weight: 1.0
  lambda_sh: 0.0            # rep supervision (0 by default; bump for joint training)
  lambda_sparsity: 0.0      # gate sparsity loss
  lambda_energy: 0.0        # pred_energy supervision (0 by default — different scale than gt em)

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0005
  optimizer: AdamW
  validation: true
  validation_iter: 4
  num_threads: 4
  batch_size: 128
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 4
