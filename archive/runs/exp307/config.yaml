# exp303 — ablation: DPT-only (no SF ViT fusion), keep KL energy loss.
# Same as renew_single_v2 except model.name = renew_dpt_only.
# The SF ViT and fusion/refinement are NOT run during depth decoding.
# FOA head + SF generator still produce pred_sh / pred_energy for losses.
dataset:
  name: soundspaces
  dataset_dir: /root/storage/matterport3d_0303renew
  split_ratio: [0.8, 0.1, 0.1]
  split_seed: 42
  input_type: echoes
  audio_format: spectrogram
  depth_type: erp
  preprocess: resize
  depth_norm: true
  images_size: [256, 512]
  min_depth: 0.01
  max_depth: 10.0
  use_ambisonic: true
  rotate_canonical: true
  gt_energy_window: early_mid

model:
  name: renew_dpt_only
  generator: renew_single
  pretrained: true
  freeze_encoder: false
  sh_dim: 36
  head_hidden: 512
  taps: [4, 8, 12]
  sf_mode: rank1
  teacher_ratio: 0.0
  fusion_ch: 256
  attn_heads: 4
  depth_weight: 1.0
  lambda_sh: 0.3
  lambda_energy: 0.1
  lambda_kl_energy: 0.05
  renew_freeze_epochs: 3

train:
  checkpoints: null
  saving_checkpoints: 10
  epochs: 40
  learning_rate: 0.0001
  optimizer: AdamW
  validation: true
  validation_iter: 2
  num_threads: 4
  batch_size: 32
  shuffle: true
  use_berhu: true
  use_silog: true
  w_berhu: 1.0
  w_silog: 0.5
  lr_warmup_epochs: 1
  lr_schedule: cosine

test:
  eval_on: test
  checkpoints: best
  num_threads: 4
  batch_size: 1
